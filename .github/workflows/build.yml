name: Build FBNeo APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'project.zip'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project.zip
        run: unzip -q project.zip -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build perl

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build
        working-directory: project
        run: bash build-android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: FBNeo-apk
          path: project/out/FBNeo.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest project/out/FBNeo.apk --title "FBNeo Android (latest build)" --notes "Install FBNeo.apk on your phone."
