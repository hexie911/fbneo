name: Build fbn4droid APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'project.zip'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project.zip
        run: unzip -q project.zip -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build perl

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build
        working-directory: project
        run: bash build-android.sh

      - name: Name the APK
        run: cp project/out/FBNeo.apk project/out/fbn4droid.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fbn4droid-apk
          path: project/out/fbn4droid.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          VC=$(grep -oE 'versionCode [0-9]+' project/app/build.gradle | head -1 | grep -oE '[0-9]+')
          VN=$(grep -oE "versionName '[^']+'" project/app/build.gradle | head -1 | cut -d"'" -f2)
          # what's new: the newest "### v..." section of the project's README
          awk '/^### v/{buf=""; next} {buf=buf $0 "\n"} END{printf "%s", buf}' project/README.md | sed '/^$/d' | head -14 > changes.txt
          FIRST=$(head -1 changes.txt | sed -E 's/^- +//' | cut -c1-140)
          {
            echo "## fbn4droid v$VN"
            echo
            echo "Download **fbn4droid.apk** below and install it. If you already have fbn4droid, use Settings > Help and about > Check for updates instead."
            echo
            echo "### What's new"
            cat changes.txt
            echo
            echo "### Build info"
            echo "versionCode: $VC"
            echo "versionName: $VN"
            echo "notes: ${FIRST:-Maintenance release.}"
          } > notes.txt
          gh release create latest project/out/fbn4droid.apk --title "fbn4droid v$VN" --notes-file notes.txt
